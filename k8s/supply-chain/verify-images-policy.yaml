---
# =============================================================================
# k8s/supply-chain/verify-images-policy.yaml — Kyverno verifyImages
# =============================================================================
# Refuses to admit pods whose container images haven't been signed by one
# of the trusted Cosign keys (or, with keyless, by an identity issued by
# Sigstore's Rekor transparency log).
#
# Three modes — uncomment exactly ONE attestor block per environment:
#
#   A. KEY-BASED      Pin a specific public key bytes. Simple, offline.
#                     Use for air-gapped clusters where Rekor isn't reachable.
#
#   B. KEYLESS        Trust any signature whose certificate's identity
#                     matches the regex below (e.g. github.com/angolardevops/*
#                     workflows). Modern, no key rotation overhead, ties
#                     signatures to a verifiable build identity in Rekor.
#
#   C. ATTESTATION    Also require an SLSA provenance attestation (not
#                     just a signature). Sets the bar higher: only images
#                     built by a specific GitHub Actions workflow pass.
#
# Lab default: keyless mode targeting angolardevops/ Actions workflows.
# Disable enforcement by patching validationFailureAction → Audit.
# =============================================================================
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-image-signatures
  annotations:
    policies.kyverno.io/title: Verify Image Signatures (Cosign / Sigstore)
    policies.kyverno.io/category: Supply Chain · SLSA L2+
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Every container image must be signed by a recognised identity.
      Defaults to keyless verification against Sigstore Rekor —
      acceptable signer identities are GitHub Actions OIDC tokens
      from the angolardevops/* repos. Switch to key-based for
      air-gapped clusters.
spec:
  validationFailureAction: Audit       # flip to Enforce when ready
  background: false
  webhookTimeoutSeconds: 30
  failurePolicy: Fail
  rules:
    - name: verify-ngolacloud-images
      match:
        any:
          - resources:
              kinds: [Pod]
      # Don't try to verify upstream / system images — they're allowed by
      # default but separately gated by the disallow-latest-tag policy.
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - cilium-system
                - kyverno
                - observability
                - trivy-system
                - falco
                - flux-system
                - opencost
                - security
      verifyImages:
        - imageReferences:
            - "ghcr.io/angolardevops/*"
            - "registry.ngolacloud.ao/*"
            - "registry.ngolacloud.com/*"   # Sprint 5 — Harbor canonical (the .ao
                                            # entry above predates the rename and
                                            # is kept for backwards compat).
            - "ngolacloud/*"
          # Kyverno requires mutateDigest=false while in Audit mode
          # (otherwise it would rewrite tags → digests at admission,
          # which is a mutating action incompatible with audit-only).
          # When flipping to Enforce, you can choose to leave this
          # false or set it to true to pin digests at admission.
          mutateDigest: false
          # ─── B. KEYLESS (default) ─────────────────────────────────────
          attestors:
            - entries:
                - keyless:
                    subject: "https://github.com/angolardevops/*"
                    issuer: "https://token.actions.githubusercontent.com"
                    rekor:
                      url: "https://rekor.sigstore.dev"
          # ─── A. KEY-BASED (alternative — comment B + uncomment A) ──────
          # attestors:
          #   - entries:
          #       - keys:
          #           publicKeys: |-
          #             -----BEGIN PUBLIC KEY-----
          #             ... (cosign generate-key-pair output) ...
          #             -----END PUBLIC KEY-----

    # ─── ngc-bpf-agent — narrower rule, signed by the dedicated workflow ──
    # The general rule above accepts any signature from angolardevops/*; this
    # narrower rule pins the agent specifically to bpf-agent-publish.yml,
    # so a leaked OIDC token from an unrelated workflow can't be used to
    # sign a tampered ngc-bpf-agent image.
    - name: verify-bpf-agent
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces:
                - ngolacloud-system
      verifyImages:
        - imageReferences:
            - "registry.ngolacloud.com/ngc-bpf-agent*"
          mutateDigest: false   # Audit-mode requirement (see general rule)
          attestors:
            - entries:
                - keyless:
                    subject: "https://github.com/angolardevops/ngolacloud-cli/.github/workflows/bpf-agent-publish.yml@*"
                    issuer: "https://token.actions.githubusercontent.com"
                    rekor:
                      url: "https://rekor.sigstore.dev"

    # ─── ngolacloud-portal — pinned to its publish workflow ───────────────
    # The portal image is built, pushed to Harbor and signed keylessly by
    # image-publish.yml (on git tag `v*`). The signing workflow URL is the
    # Fulcio cert subject, so we pin admission to that exact workflow — not the
    # broad angolardevops/* identity the general rule accepts. Blast radius is
    # high: the portal runs as the platform control plane (creates clusters,
    # runs helm against tenant namespaces).
    - name: verify-portal
      match:
        any:
          - resources:
              kinds: [Pod]
      verifyImages:
        - imageReferences:
            - "registry.ngolacloud.com/ngolacloud/portal*"
          mutateDigest: false   # Audit-mode requirement (see general rule)
          attestors:
            - entries:
                - keyless:
                    subject: "https://github.com/angolardevops/ngolacloud-portal/.github/workflows/image-publish.yml@*"
                    issuer: "https://token.actions.githubusercontent.com"
                    rekor:
                      url: "https://rekor.sigstore.dev"

    # ─── ngc-bpf-operator — pinned to its own publish workflow ────────────
    # Same reasoning as verify-bpf-agent: the operator runs with broad RBAC
    # (it creates DaemonSets, SAs, Secrets across the firewall fleet), so a
    # tampered operator image is high blast-radius. Pin admission to images
    # signed specifically by operator-publish.yml.
    - name: verify-bpf-operator
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces:
                - ngolacloud-system
      verifyImages:
        - imageReferences:
            - "registry.ngolacloud.com/ngolacloud-images/ngc-bpf-operator*"
          mutateDigest: false   # Audit-mode requirement (see general rule)
          attestors:
            - entries:
                - keyless:
                    subject: "https://github.com/angolardevops/ngolacloud-bpf-operator/.github/workflows/operator-publish.yml@*"
                    issuer: "https://token.actions.githubusercontent.com"
                    rekor:
                      url: "https://rekor.sigstore.dev"
